        title: "Simulating Clinical Teams: A Multi-Agent LLM Framework (KTAS Triage)"
        sub_title: Lead Researcher / Co-Author · LUMS
        caption: Lahore, Pakistan
        description: |
          **Medical AI — agentic emergency triage.** Co-authored work on an LLM-based **multi-agent** clinical framework using **LangGraph**, **LangChain**, and Gemini to simulate collaborative medical teams for Korean Triage and Acuity Scale (KTAS) prediction.

          - Architected a **multi-agent** triage system with LangGraph state graphs and LangChain-style orchestration; parallel **adversarial** agent paths (safety-biased vs. resource-weighted) merged via a synthesis “Decider” node to address the triage safety–efficiency tradeoff.
          - Achieved **83% Top-2** KTAS accuracy and **6% under-triage**; validated with Weighted Kappa (~0.70) and high diagnostic similarity (~0.89) on **1,267** ED cases.
          - Engineered clinical features (e.g., Shock Index), PCA analysis, and **S-PubMedBERT**-based semantic evaluation; enforced structured reasoning with **Pydantic** schemas across diagnostic vs. administrative steps.

